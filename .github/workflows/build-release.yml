name: Multiplatform Build & Release FzComputerAI GUI

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build & Code-Sign (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: fzcomputerai.exe
            asset_name: fzcomputerai-windows-x64.exe
          - os: macos-latest
            artifact_name: fzcomputerai
            asset_name: fzcomputerai-macos
          - os: ubuntu-latest
            artifact_name: fzcomputerai
            asset_name: fzcomputerai-linux-x64

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stamp Version from Tag (Cargo.toml + package.json)
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Tag ${GITHUB_REF_NAME} -> versao ${VERSION}"
          # Substitui apenas a PRIMEIRA ocorrencia (secao [package]) — perl e portavel nos 3 runners (GNU/BSD sed divergem)
          perl -0777 -pi -e "s/^version = \"[^\"]*\"/version = \"${VERSION}\"/m" fzcomputerai/Cargo.toml
          perl -0777 -pi -e "s/\"version\": \"[^\"]*\"/\"version\": \"${VERSION}\"/" package.json
          echo "--- fzcomputerai/Cargo.toml ---"
          grep -n '^version = ' fzcomputerai/Cargo.toml
          echo "--- package.json ---"
          grep -n '"version":' package.json

      - name: Install Linux GUI Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libgl1-mesa-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev libfontconfig1-dev libgtk-3-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            fzcomputerai/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build fzcomputerai GUI (Release)
        run: |
          cargo build --release --manifest-path fzcomputerai/Cargo.toml

      - name: Auto-Sign Windows Executable (Authenticode)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=FzComputerAI (Webstorage Tecnologia)" -CertStoreLocation "Cert:\CurrentUser\My"
          Set-AuthenticodeSignature -FilePath "fzcomputerai/target/release/fzcomputerai.exe" -Certificate $cert
          Copy-Item "fzcomputerai/target/release/fzcomputerai.exe" "${{ matrix.asset_name }}"

      - name: Rename Non-Windows Artifacts
        if: runner.os != 'Windows'
        run: |
          cp fzcomputerai/target/release/fzcomputerai ${{ matrix.asset_name }}

      - name: Generate SHA256 Checksum
        shell: bash
        run: |
          # sha256sum existe no Linux e no Git Bash (Windows); macOS usa shasum
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.asset_name }}" > "${{ matrix.asset_name }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset_name }}" > "${{ matrix.asset_name }}.sha256"
          fi
          cat "${{ matrix.asset_name }}.sha256"

      - name: Publish GitHub Release Artifact
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256
          body: |
            ## FzComputerAI ${{ github.ref_name }} — Standalone Binaries (Multiplatform)
            
            - **Auto-signed (Windows Authenticode)**: Evita o aviso do Windows Defender / SmartScreen.
            - **Integridade (SHA256)**: Cada binário acompanha um arquivo `.sha256` — verifique com `sha256sum -c` (Linux/Git Bash) ou `shasum -a 256 -c` (macOS).
            - **Suporte Multiplataforma**: Binários compilados nativamente para Windows (x64), macOS (Intel & Apple Silicon) e Linux (x64).
            - **Visão Computacional por MCP**: Servidor nativo de visão e automação.
            - **Transporte HTTP/TCP (Porta 8000)**: Conexão pronta para o **FazAI-NG**.
            - **Patrocinadores**: Webstorage Tecnologia (www.webstorage.com.br) & Imóvel Site (www.imovelsite.com.br).
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
