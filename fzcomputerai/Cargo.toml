[package]
name = "fzcomputerai"
version = "2.3.2"
edition = "2021"
authors = ["Roger Luft (VeilWalker) <roger@webstorage.com.br>"]
description = "Interface Gráfica Nativa em Rust para FzComputerAI & CUA Driver MCP"
license = "MIT"
# build.rs embute o recurso VERSIONINFO do Windows no .exe (ver o cabecalho
# do proprio build.rs). Sem isso as Propriedades do arquivo saem em branco.
build = "build.rs"

# So no Windows: em ubuntu/macos o build.rs e no-op e esta dependencia nem e
# resolvida. O seletor cfg(windows) aqui olha para o HOST que compila o
# build script — a guarda do alvo real fica dentro do build.rs.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# ---------------------------------------------------------------------------
# Empacotamento Linux (CI: .deb via cargo-deb, .rpm via cargo-generate-rpm;
# AppImage e montado direto no workflow com o appimagetool oficial).
# Decisao do projeto: AppImage + .deb + .rpm — SEM snap, SEM .dmg.
# Os pacotes instalam SOMENTE o binario da GUI: o motor cua-driver continua
# sendo instalado pelo instalador oficial do projeto Cua (install.sh).
# ---------------------------------------------------------------------------
[package.metadata.deb]
maintainer = "Roger Luft (VeilWalker) <roger@webstorage.com.br>"
copyright = "2026, Roger Luft (VeilWalker) - Webstorage Tecnologia"
extended-description = "Native Rust/egui cockpit for the cua-driver Computer Vision & UI Automation MCP engine (Cua project)."
section = "utils"
priority = "optional"
assets = [
    ["target/release/fzcomputerai", "usr/bin/", "755"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/fzcomputerai", dest = "/usr/bin/fzcomputerai", mode = "755" },
]

[dependencies]
eframe = { version = "0.29.1", default-features = false, features = ["default_fonts", "glow"] }
egui = { version = "0.29.1", default-features = false }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
open = "5.3"

# ---------------------------------------------------------------------------
# HTTPS do endpoint MCP (fzcomputerai/src/tls.rs) — v2.2.0.
# Terminacao TLS DENTRO do app (mesmo desenho do LAN forward) com rustls;
# certificado auto-assinado gerado por rcgen; Let's Encrypt via instant-acme
# (ACME RFC 8555, desafio HTTP-01); inspecao do certificado real na tela com
# x509-parser. Backend criptografico: ring em TODAS as crates (aws-lc-rs
# exigiria cmake+nasm no runner Windows do release). tokio ja era dependencia.
# ---------------------------------------------------------------------------
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1.12", features = ["std"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "crypto"] }
instant-acme = { version = "0.8", default-features = false, features = ["ring", "hyper-rustls"] }
x509-parser = "0.18"
ring = "0.17"
time = "0.3"
rustls-platform-verifier = "0.7"
